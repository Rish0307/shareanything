kind = "web"
previewPath = "/"
title = "ShareIt - Instant File & Text Sharing"
version = "1.0.0"
id = "artifacts/shareit"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21666

[services.development]
run = "pnpm --filter @workspace/shareit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shareit", "run", "build" ]
publicDir = "artifacts/shareit/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21666"
BASE_PATH = "/"
