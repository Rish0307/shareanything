openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ShareIt - Instant File, Text, and URL Sharing API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: shares
    description: Share operations
  - name: files
    description: File operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /shares:
    get:
      operationId: listShares
      tags: [shares]
      summary: List recent shares
      description: Returns a list of recent shares
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: type
          in: query
          schema:
            type: string
            enum: [text, file, url, all]
            default: all
      responses:
        "200":
          description: List of shares
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Share"

    post:
      operationId: createShare
      tags: [shares]
      summary: Create a text or URL share
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareBody"
      responses:
        "201":
          description: Created share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shares/{id}:
    get:
      operationId: getShare
      tags: [shares]
      summary: Get a share by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Share details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteShare
      tags: [shares]
      summary: Delete a share
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shares/{id}/download:
    get:
      operationId: downloadFile
      tags: [shares]
      summary: Download a file share
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shares/upload:
    post:
      operationId: uploadFile
      tags: [files]
      summary: Upload a file share
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: ["string", "null"]
              required:
                - file
      responses:
        "201":
          description: Uploaded file share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      operationId: getStats
      tags: [shares]
      summary: Get platform stats
      responses:
        "200":
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Share:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [text, file, url]
        title:
          type: ["string", "null"]
        content:
          type: ["string", "null"]
        fileName:
          type: ["string", "null"]
        fileSize:
          type: ["integer", "null"]
        mimeType:
          type: ["string", "null"]
        downloadUrl:
          type: ["string", "null"]
        downloadCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - type
        - downloadCount
        - createdAt

    CreateShareBody:
      type: object
      properties:
        type:
          type: string
          enum: [text, url]
        content:
          type: string
        title:
          type: ["string", "null"]
      required:
        - type
        - content

    Stats:
      type: object
      properties:
        totalShares:
          type: integer
        totalFiles:
          type: integer
        totalTextShares:
          type: integer
        totalUrlShares:
          type: integer
        totalDownloads:
          type: integer
      required:
        - totalShares
        - totalFiles
        - totalTextShares
        - totalUrlShares
        - totalDownloads

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
